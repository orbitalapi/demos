// The "default" workspace of the "default" organisation.
// Paths are relative to this file. Projects created from Orbital's UI land under
// orbital/workspace/projects/ too, next to the two this demo ships with.
file {
   projects = [
      // The Taxi project: semantic types, the database table, and (under orbital/config)
      // the "films" database connection.
      {
         path: "orbital/workspace/projects/com.petflix.demos/films/0.1.0/taxi.conf"
         isEditable: true
      },
      // The OpenAPI spec for the Spring Boot services in ./services, annotated with
      // x-taxi-type so Orbital can link its operations to the types above.
      {
         path: "orbital/workspace/projects/com.petflix/PetflixServices/0.1.20/api-docs.yaml"
         loader: {
            packageType: OpenApi
            identifier: {
               organisation: "com.petflix"
               name: "PetflixServices"
               version: "0.1.20"
            }
            defaultNamespace: "com.petflix"
            // Where Orbital calls the services from inside the compose network. Without this,
            // the spec's own servers entry (http://localhost:7033) would be used.
            serviceBasePath: "http://demo-services:7033"
         }
      }
   ]
}
