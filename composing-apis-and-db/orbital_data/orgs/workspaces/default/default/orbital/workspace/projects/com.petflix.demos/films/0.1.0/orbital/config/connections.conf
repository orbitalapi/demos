// Connections Orbital uses when running queries against this project.
// The "films" connection is what FilmDb.taxi refers to in @DatabaseService(connection = "films").
// Credentials are kept in env.conf, next to this file, and substituted in here.
jdbc {
   films {
      connectionName = films
      jdbcDriver = POSTGRES
      connectionParameters {
         database = ${config.database.name}
         host = ${config.database.host}
         port = ${config.database.port}
         username = ${config.database.username}
         password = ${config.database.password}
      }
   }
}
