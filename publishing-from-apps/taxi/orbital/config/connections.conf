// The "films" database connection that film/Film.taxi refers to.
// Optional: the services in this demo don't need it. Point it at a Pagila database (eg., the one
// from the importing-through-ui demo) to also query films from the database. Values come from
// env.conf, next to this file.
jdbc {
   films {
      connectionName = films
      jdbcDriver = POSTGRES
      connectionParameters {
         database = ${config.database.name}
         host = ${config.database.host}
         port = ${config.database.port}
         username = ${config.database.username}
         password = ${config.database.password}
      }
   }
}
