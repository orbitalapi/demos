server.port: 9985
spring:
  main:
    banner-mode: off
  application:
    name: squashed-tomatoes

# Where the schema-publisher starter sends the Taxi it generates from this app's controllers.
orbital:
  schema:
    publisher:
      # ws:// (rather than http://) keeps a connection open, so the schema is re-published
      # automatically if Orbital restarts.
      orbital-url: ws://localhost:9022
      # The base url Orbital will call this application on.
      base-url: http://localhost:9985
      # The id of the published project, in the form organisation/name/version.
      package-id: io.petflix.demos/films-reviews/1.0.0
