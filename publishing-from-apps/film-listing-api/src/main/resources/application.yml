server.port: 9981
spring:
  main:
    banner-mode: off
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer:  org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      group-id: films-producer
  application:
    name: films-service

# Where the schema-publisher starter sends the Taxi it generates from this app's controllers.
orbital:
  schema:
    publisher:
      # ws:// (rather than http://) keeps a connection open, so the schema is re-published
      # automatically if Orbital restarts.
      orbital-url: ws://localhost:9022
      # The base url Orbital will call this application on.
      base-url: http://localhost:9981
      # The id of the published project, in the form organisation/name/version.
      package-id: io.petflix.demos/films-listings/1.0.0
