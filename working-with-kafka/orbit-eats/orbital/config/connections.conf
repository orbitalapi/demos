kafka {
   orbit-eats-kafka {
      connectionName=orbit-eats-kafka
      connectionParameters {
         brokerAddress=${NEBULA_KAFKA_BOOTSTRAP_SERVERS}
         // No groupId: Orbital gives each consumer its own group, so several
         // streams (and ad-hoc queries) can read the same topic at the same time.
      }
   }
}
hazelcast {
   orbit-eats-hazelcast {
      connectionName = orbit-eats-hazelcast
      addresses = [${NEBULA_HAZELCAST_HOST}":"${NEBULA_HAZELCAST_PORT}]
      default = true
   }
}
mongo {
   orbit-eats-mongo {
      connectionName = orbit-eats-mongo
      connectionParameters {
         dbName = "orbit-eats"
         connectionString = ${NEBULA_MONGO_CONNECTION_STRING}
      }
   }
}
