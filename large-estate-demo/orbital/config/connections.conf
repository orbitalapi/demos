// The Nebula stack (orbital/nebula/acme-estate.nebula.kts) starts a single Postgres
// container, so one JDBC connection serves all 22 tables.
jdbc {
  acme-db {
    connectionName = acme-db
    jdbcDriver = POSTGRES
    connectionParameters {
      database = ${NEBULA_ACME_ESTATE_POSTGRES_DATABASE_NAME}
      host = ${NEBULA_ACME_ESTATE_POSTGRES_HOST}
      password = ${NEBULA_ACME_ESTATE_POSTGRES_PASSWORD}
      port = ${NEBULA_ACME_ESTATE_POSTGRES_PORT}
      username = ${NEBULA_ACME_ESTATE_POSTGRES_USERNAME}
    }
  }
}
