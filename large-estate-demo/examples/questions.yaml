source_semantics: sources is one known route through the estate; other routes can produce the same answer
taxiql_semantics: 'Read queries deliberately avoid pinning sources, so Orbital discovers the path through the estate.
  Write examples use TaxiQL query-mutate statements: each statement resolves and projects the data one write operation
  needs, then `call`s it. TaxiQL allows one mutation per query, so workflows needing several mutations use several
  statements. Values produced by an earlier mutation (such as an RMA ID) appear as literals in later statements because the
  Nebula stub responses are deterministic.'
