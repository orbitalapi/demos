- id: C14
  level: 6
  mode: write
  question: Do what you can to expedite ORD-38291 without substituting the product.
  answer: Potential actions are an RTM→BHX stock transfer, supplier PO expedition and pick expedition after stock becomes
    available.
  sources:
  - orders.getOrderLines
  - db.inventory.inventory_sku_map
  - warehouse.getNetworkAvailability
  - warehouse.createWarehouseTransfer
  - procurement.searchPurchaseOrders
  - procurement.expeditePurchaseOrder
  - warehouse.getPicksForOrder
  - warehouse.expeditePick
  semantic_path:
  - OrderId
  - ProductSku
  - WarehouseSku
  - WarehouseCode
  - PurchaseOrderId
  - PickId
  taxiql:
  - |-
    given {
       orderId : com.acme.orders.OrderId = 'ORD-38291'
    }
    find { com.acme.orders.Order } as {
       lines : com.acme.orders.OrderLine[] as {
          lineId : com.acme.orders.OrderLineId
          productSku : com.acme.catalog.ProductSku
          mapping : com.acme.db.inventory.InventorySkuMapRow[] as {
             warehouseSku : com.acme.warehouse.WarehouseSku
             availability : com.acme.warehouse.StockPosition[] as {
                warehouse : com.acme.warehouse.WarehouseCode
                available : com.acme.warehouse.AvailableQuantity
             }[]
             purchaseOrders : com.acme.procurement.PurchaseOrder[] as {
                purchaseOrderId : com.acme.procurement.PurchaseOrderId
                expectedReceipt : com.acme.procurement.ExpectedReceiptDate
                status : com.acme.procurement.PurchaseOrderStatus
             }[]
          }[]
       }[]
       picks : com.acme.warehouse.Pick[] as {
          pickId : com.acme.warehouse.PickId
          warehouse : com.acme.warehouse.WarehouseCode
          status : com.acme.warehouse.PickStatus
          blockedReason : com.acme.warehouse.PickBlockReason?
       }[]
    }
  - |-
    given {
       productSku : com.acme.catalog.ProductSku = 'ACM-7710-X'
       sourceWarehouse : com.acme.warehouse.WarehouseCode = 'RTM'
       targetWarehouse : com.acme.warehouse.WarehouseCode = 'BHX'
       transferQuantity : com.acme.shared.Quantity = 40
    }
    find {
       com.acme.db.inventory.InventorySkuMapRow(
          com.acme.catalog.ProductSku == productSku
       )
    } as {
       request : com.acme.warehouse.TransferRequest = {
          item_code: com.acme.warehouse.WarehouseSku,
          from_warehouse: sourceWarehouse,
          to_warehouse: targetWarehouse,
          qty: transferQuantity
       }
    }
    call com.acme.warehouse.TransfersService::createWarehouseTransfer
  - |-
    given {
       purchaseOrderId : com.acme.procurement.PurchaseOrderId = 'PO-90077'
       requiredBy : com.acme.procurement.RequiredByDate = '2026-08-10'
       expediteReason : com.acme.procurement.ExpediteReason = 'CUSTOMER_DELIVERY_AT_RISK'
    }
    find {
       com.acme.procurement.PurchaseOrder(
          com.acme.procurement.PurchaseOrderId == purchaseOrderId
       )
    } as {
       purchaseOrderId : com.acme.procurement.PurchaseOrderId = purchaseOrderId
       request : com.acme.procurement.ExpediteRequest = {
          reason: expediteReason,
          required_by: requiredBy
       }
    }
    call com.acme.procurement.Purchase_ordersPoIdExpediteService::expeditePurchaseOrder
  - |-
    given {
       orderId : com.acme.orders.OrderId = 'ORD-38291'
    }
    find {
       com.acme.warehouse.Pick(com.acme.orders.OrderId == orderId)
    } as {
       pickId : com.acme.warehouse.PickId
    }
    call com.acme.warehouse.PicksPickIdExpediteService::expeditePick
