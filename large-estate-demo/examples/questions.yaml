- id: C09
  level: 6
  mode: write
  question: Cancel line L-20 on ORD-38291 and refund the customer for that line.
  answer: L-20 is 60 x GBP 41.20 = GBP 2,472.00. Cancel the line, release its reservation, issue a GBP 2,472.00 credit note,
    convert that amount to 247,200 minor units, and refund TX-88292.
  sources:
  - orders.getOrderLines
  - warehouse.getReservationsForOrder
  - warehouse.getPicksForOrder
  - orders.cancelOrderLines
  - warehouse.releaseReservation
  - billing.listInvoicesForDebtor
  - payments.listPaymentsForInvoice
  - billing.createCreditNote
  - payments.convertMajorToMinor
  - payments.createRefund
  semantic_path:
  - OrderId
  - OrderLineId
  - Quantity
  - InvoiceNumber
  - TransactionId
  - MoneyAmount
  - MinorUnitAmount
  taxiql:
  - |-
    given {
       orderId : com.acme.orders.OrderId = 'ORD-38291'
       lineId : com.acme.orders.OrderLineId = 'L-20'
       cancellationReason : com.acme.orders.CancellationReason = 'CUSTOMER_REQUEST'
    }
    find {
       com.acme.orders.OrderLine(
          com.acme.orders.OrderId == orderId &&
          com.acme.orders.OrderLineId == lineId
       )
    } as {
       orderId : com.acme.orders.OrderId = orderId
       request : com.acme.orders.CancelLinesRequest = {
          line_refs: [lineId],
          reason: cancellationReason
       }
    }
    call com.acme.orders.OrdersOrderIdCancel_linesService::cancelOrderLines
  - |-
    given {
       orderId : com.acme.orders.OrderId = 'ORD-38291'
       lineId : com.acme.orders.OrderLineId = 'L-20'
       releaseReason : com.acme.warehouse.ReservationReleaseReason = 'ORDER_LINE_CANCELLED'
    }
    find {
       com.acme.warehouse.Reservation(
          com.acme.orders.OrderId == orderId &&
          com.acme.orders.OrderLineId == lineId
       )
    } as {
       request : com.acme.warehouse.ReleaseRequest = {
          reservation_id: com.acme.warehouse.ReservationId,
          reason: releaseReason
       }
    }
    call com.acme.warehouse.ReservationsReleaseService::releaseReservation
  - |-
    given {
       orderId : com.acme.orders.OrderId = 'ORD-38291'
       lineId : com.acme.orders.OrderLineId = 'L-20'
       creditReason : com.acme.billing.CreditNoteReason = 'ORDER_LINE_CANCELLED'
    }
    find {
       com.acme.billing.Invoice(com.acme.orders.OrderId == orderId)
    } as {
       request : com.acme.billing.CreditNoteRequest = {
          invoice_no: com.acme.billing.InvoiceNumber,
          amount: com.acme.orders.OrderLine(
             com.acme.orders.OrderLineId == lineId
          )::com.acme.orders.OrderLineNetAmount,
          currency: com.acme.shared.CurrencyCode,
          reason: creditReason
       }
    }
    call com.acme.billing.Credit_notesService::createCreditNote
  - |-
    given {
       orderId : com.acme.orders.OrderId = 'ORD-38291'
       lineId : com.acme.orders.OrderLineId = 'L-20'
       refundReason : com.acme.payments.RefundReason = 'ORDER_LINE_CANCELLED'
    }
    find {
       com.acme.orders.OrderLine(
          com.acme.orders.OrderId == orderId &&
          com.acme.orders.OrderLineId == lineId
       )
    } as {
       request : com.acme.payments.RefundRequest = {
          transaction_ref: com.acme.payments.TransactionId,
          amount_minor: com.acme.payments.MinorUnitAmount,
          reason_code: refundReason
       }
    }
    call com.acme.payments.RefundsService::createRefund
- id: C10
  level: 5
  mode: write
  question: Sarah says 2 units of ACM-7710-X from order ORD-37900 arrived damaged. Start the return and prepare the credit.
  answer: Resolve Sarah, verify ORD-37900 and line L-20, create the RMA, receive/approve 2 units for GBP 82.40, then prepare
    the matching ERP credit against INV-88014.
  sources:
  - crm.searchContacts
  - identity.getIdentityUserByEmail
  - orders.getOrder
  - orders.getOrderLines
  - returns.getReturnEligibility
  - returns.createRma
  - returns.receiveReturn
  - returns.approveReturnCredit
  - billing.listInvoicesForDebtor
  - billing.createCreditNote
  semantic_path:
  - PersonName
  - EmailAddress
  - Identity UserId
  - OrderId
  - OrderLineId
  - RmaId
  - InvoiceNumber
  taxiql:
  - |-
    given {
       personName : com.acme.shared.PersonName = 'Sarah Jones'
       orderId : com.acme.orders.OrderId = 'ORD-37900'
       lineId : com.acme.orders.OrderLineId = 'L-20'
       returnQuantity : com.acme.shared.Quantity = 2
       returnReason : com.acme.returns.ReturnReason = 'DAMAGED'
    }
    find {
       com.acme.returns.Eligibility(
          com.acme.orders.OrderId == orderId &&
          com.acme.orders.OrderLineId == lineId
       )
    } as com.acme.returns.RmaRequest
    call com.acme.returns.RmasService::createRma
  - |-
    given {
       rmaId : com.acme.returns.RmaId = 'RMA-6001'
       receivedQuantity : com.acme.shared.Quantity = 2
    }
    find {
       com.acme.returns.Rma(com.acme.returns.RmaId == rmaId)
    } as {
       rmaId : com.acme.returns.RmaId = rmaId
       request : com.acme.returns.ReceiveRequest = {
          received_qty: receivedQuantity
       }
    }
    call com.acme.returns.RmasRmaIdReceiveService::receiveReturn
  - |-
    given {
       rmaId : com.acme.returns.RmaId = 'RMA-6001'
       approvedAmount : com.acme.shared.MoneyAmount = 82.40
    }
    find {
       com.acme.returns.Rma(com.acme.returns.RmaId == rmaId)
    } as {
       rmaId : com.acme.returns.RmaId = rmaId
       request : com.acme.returns.ApproveRequest = {
          approved_amount: approvedAmount
       }
    }
    call com.acme.returns.RmasRmaIdApproveService::approveReturnCredit
  - |-
    given {
       orderId : com.acme.orders.OrderId = 'ORD-37900'
       creditAmount : com.acme.shared.MoneyAmount = 82.40
       creditReason : com.acme.billing.CreditNoteReason = 'DAMAGED_RETURN'
    }
    find {
       com.acme.billing.Invoice(com.acme.orders.OrderId == orderId)
    } as {
       request : com.acme.billing.CreditNoteRequest = {
          invoice_no: com.acme.billing.InvoiceNumber,
          amount: creditAmount,
          currency: com.acme.shared.CurrencyCode,
          reason: creditReason
       }
    }
    call com.acme.billing.Credit_notesService::createCreditNote
- id: C11
  level: 6
  mode: write
  question: Northbridge’s agreement expired last week. Renew it for twelve months on the same terms with a 4% price uplift.
  answer: Agreement AGR-44018 expired 31 Jul 2026. Read existing price rules, calculate 4% uplift, then upsert the renewed
    agreement/pricing records.
  sources:
  - crm.searchAccounts
  - db.contracts.contracts_agreement
  - db.contracts.contracts_price_rule
  - pricing.calculateUpliftedPrice
  - db.contracts.saveAgreement
  - db.contracts.savePriceRule
  semantic_path:
  - CustomerName
  - CompanyRegistrationNumber
  - AgreementId
  - ContractUnitPrice
  - Percentage
  - Agreement write
  taxiql:
  - |-
    given {
       customerName : com.acme.shared.CustomerName = 'Northbridge Rail Engineering'
       renewalStart : com.acme.contracts.ContractStartDate = '2026-08-01'
       renewalEnd : com.acme.contracts.ContractEndDate = '2027-07-31'
       activeStatus : com.acme.contracts.AgreementStatus = 'ACTIVE'
    }
    find {
       com.acme.db.contracts.ContractsAgreementRow(
          com.acme.shared.CustomerName == customerName
       )
    } as {
       agreement_id : com.acme.contracts.AgreementId
       company_no : com.acme.shared.CompanyRegistrationNumber
       debtor_code : com.acme.erp.DebtorCode
       starts_on : com.acme.contracts.ContractStartDate = renewalStart
       ends_on : com.acme.contracts.ContractEndDate = renewalEnd
       currency : com.acme.shared.CurrencyCode
       status : com.acme.contracts.AgreementStatus = activeStatus
    }
    call com.acme.db.contracts.ContractsDatabase::saveAgreement
  - |-
    given {
       customerName : com.acme.shared.CustomerName = 'Northbridge Rail Engineering'
       uplift : com.acme.shared.Percentage = 4.0
    }
    find {
       com.acme.db.contracts.ContractsPriceRuleRow[](
          com.acme.shared.CustomerName == customerName
       )
    } as (calculation: com.acme.pricing.PriceCalculation) -> {
       rule_id : com.acme.contracts.PriceRuleId
       agreement_id : com.acme.contracts.AgreementId
       product_sku : com.acme.catalog.ProductSku
       unit_price : com.acme.pricing.ContractUnitPrice = calculation.result_amount
       discount_pct : com.acme.pricing.DiscountPercentage
    }[]
    call com.acme.db.contracts.ContractsDatabase::savePriceRule
- id: C12
  level: 5
  mode: legacy
  question: Did Northbridge have any orders before we migrated them off Northstar, and do we still have stock under the old
    product codes?
  answer: Northbridge maps to legacy customer NSC-441; legacy order NO-9912 exists. Legacy SKU NX7710 has 12 free units in
    GLA.
  sources:
  - crm.searchAccounts
  - legacy.getLegacyCustomerByCompany
  - legacy.listLegacyOrders
  - db.inventory.inventory_sku_map
  - legacy.getLegacyStock
  semantic_path:
  - CustomerName
  - CompanyRegistrationNumber
  - LegacyCustomerId
  - LegacyOrderId
  - LegacySku
  taxiql:
  - |-
    given {
       customerName : com.acme.shared.CustomerName = 'Northbridge Rail Engineering'
    }
    find { com.acme.crm.Account[] } as {
       companyNumber : com.acme.shared.CompanyRegistrationNumber
       legacyCustomer : com.acme.legacy.LegacyCustomer as {
          legacyCustomerId : com.acme.legacy.LegacyCustomerId
          migratedDebtor : com.acme.erp.DebtorCode
          orders : com.acme.legacy.LegacyOrder[] as {
             legacyOrderId : com.acme.legacy.LegacyOrderId
             orderDate : com.acme.legacy.LegacyOrderDate
             status : com.acme.legacy.LegacyOrderStatus
          }[]
       }
       legacyMappings : com.acme.db.inventory.InventorySkuMapRow[].filter(
          (mapping: com.acme.db.inventory.InventorySkuMapRow) -> mapping::com.acme.legacy.LegacySku != null
       ) as {
          productSku : com.acme.catalog.ProductSku
          legacySku : com.acme.legacy.LegacySku
          legacyStock : com.acme.legacy.LegacyStock as {
             freeQuantity : com.acme.shared.Quantity
             warehouse : com.acme.warehouse.WarehouseCode
          }
       }[]
    }[]
