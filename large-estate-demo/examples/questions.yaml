questions:
- id: C01
  level: 1
  mode: read
  question: What is the current delivery status of order ORD-38291?
  answer: The order is only partially allocated; a carrier label exists but the parcel has not been handed over.
  sources:
  - orders.getOrderStatus
  - logistics.getShipmentsByOrder
  - logistics.getTracking
  semantic_path:
  - OrderId
  - OrderStatus
  - ShipmentId + TrackingNumber
  - ShipmentStatus + TrackingStatus
  taxiql:
  - |-
    given {
       orderId : com.acme.orders.OrderId = 'ORD-38291'
    }
    find { com.acme.orders.OrderStatusResponse } as {
       orderId : com.acme.orders.OrderId
       orderStatus : com.acme.orders.OrderStatus
       holdReason : com.acme.orders.OrderHoldReason?
       shipments : com.acme.logistics.Shipment[] as {
          shipmentId : com.acme.logistics.ShipmentId
          shipmentStatus : com.acme.logistics.ShipmentStatus
          trackingNumber : com.acme.logistics.TrackingNumber
          tracking : com.acme.logistics.Tracking as {
             trackingStatus : com.acme.logistics.TrackingStatus
             lastEventAt : com.acme.logistics.TrackingEventAt
             detail : com.acme.logistics.TrackingDetail
          }
       }[]
    }
- id: C02
  level: 3
  mode: read
  question: Who is the account manager for the customer who placed order ORD-38291?
  answer: Emily Carter.
  sources:
  - orders.getOrder
  - billing.getDebtor
  - crm.getAccountByCompanyNumber
  - crm.getAccountOwner
  semantic_path:
  - OrderId
  - DebtorCode
  - CompanyRegistrationNumber
  - AccountId
  - CRM UserId
  taxiql:
  - |-
    given {
       orderId : com.acme.orders.OrderId = 'ORD-38291'
    }
    find { com.acme.orders.Order } as {
       orderId : com.acme.orders.OrderId
       debtorCode : com.acme.erp.DebtorCode
       companyNumber : com.acme.shared.CompanyRegistrationNumber
       crmAccountId : com.acme.crm.AccountId
       accountManager : com.acme.crm.AccountOwner as {
          userId : com.acme.crm.UserId
          name : com.acme.shared.PersonName
          email : com.acme.shared.EmailAddress
       }
    }
- id: C03
  level: 4
  mode: fanout
  question: Sarah Jones is on the phone. Show her open orders, unpaid invoices, and outstanding support tickets.
  answer: Open order ORD-38291; unpaid invoices include overdue INV-88014 and open INV-88291; open support ticket TCK-7788.
  sources:
  - crm.searchContacts
  - identity.getIdentityUserByEmail
  - identity.getOrganisation
  - billing.getDebtorByCompany
  - orders.listOrdersByPortalUser
  - billing.listInvoicesForDebtor
  - crm.getAccountByCompanyNumber
  - support.listTicketsForAccount
  semantic_path:
  - PersonName
  - EmailAddress
  - Identity UserId + OrganisationId
  - CompanyRegistrationNumber
  - DebtorCode + AccountId
  - Orders + Invoices + Tickets
  taxiql:
  - |-
    given {
       personName : com.acme.shared.PersonName = 'Sarah Jones'
    }
    find { com.acme.crm.Contact[] } as {
       personName : com.acme.shared.PersonName
       email : com.acme.shared.EmailAddress
       identityUserId : com.acme.identity.UserId
       organisationId : com.acme.identity.OrganisationId
       companyNumber : com.acme.shared.CompanyRegistrationNumber
       debtorCode : com.acme.erp.DebtorCode
       crmAccountId : com.acme.crm.AccountId
       openOrders : com.acme.orders.Order[].filter(
          (order: com.acme.orders.Order) -> order::com.acme.orders.OrderStatus != 'DELIVERED'
       ) as {
          orderId : com.acme.orders.OrderId
          status : com.acme.orders.OrderStatus
          requestedDelivery : com.acme.orders.RequestedDeliveryDate
       }[]
       unpaidInvoices : com.acme.billing.Invoice[].filter(
          (invoice: com.acme.billing.Invoice) -> invoice::com.acme.billing.InvoiceStatus != 'PAID'
       ) as {
          invoiceNumber : com.acme.billing.InvoiceNumber
          status : com.acme.billing.InvoiceStatus
          amount : com.acme.shared.MoneyAmount
          dueDate : com.acme.billing.InvoiceDueDate
       }[]
       outstandingTickets : com.acme.support.Ticket[].filter(
          (ticket: com.acme.support.Ticket) -> ticket::com.acme.support.TicketStatus != 'CLOSED'
       ) as {
          ticketId : com.acme.support.TicketId
          subject : com.acme.support.TicketSubject
          status : com.acme.support.TicketStatus
       }[]
    }[]
- id: C04
  level: 5
  mode: diagnostic
  question: Why has order ORD-38291 not shipped, and when can it move?
  answer: Line L-20 for ACM-7710-X is short at BHX. Only 20 are allocated there; 40 are free in Rotterdam. The pick is blocked
    by full-order-ship policy. PO-90077 brings 200 units to BHX on 11 Aug; supplier lead time is 7 days.
  sources:
  - orders.getOrderLines
  - db.inventory.inventory_sku_map
  - warehouse.getNetworkAvailability
  - warehouse.getReservationsForOrder
  - warehouse.getPicksForOrder
  - procurement.getInboundForWarehouse
  - procurement.getPurchaseOrderLines
  - supplier.getSupplierLeadTime
  semantic_path:
  - OrderId
  - ProductSku
  - WarehouseSku + SupplierPartNumber
  - Stock/Reservation/Pick
  - PurchaseOrderId
  - LeadTimeDays
  taxiql:
  - |-
    given {
       orderId : com.acme.orders.OrderId = 'ORD-38291'
    }
    find { com.acme.orders.Order } as {
       orderId : com.acme.orders.OrderId
       orderStatus : com.acme.orders.OrderStatus
       holdReason : com.acme.orders.OrderHoldReason
       reservations : com.acme.warehouse.Reservation[] as {
          reservationId : com.acme.warehouse.ReservationId
          lineId : com.acme.orders.OrderLineId
          warehouse : com.acme.warehouse.WarehouseCode
          warehouseSku : com.acme.warehouse.WarehouseSku
          reservedQuantity : com.acme.shared.Quantity
          status : com.acme.warehouse.ReservationStatus
       }[]
       picks : com.acme.warehouse.Pick[] as {
          pickId : com.acme.warehouse.PickId
          warehouse : com.acme.warehouse.WarehouseCode
          status : com.acme.warehouse.PickStatus
          blockedReason : com.acme.warehouse.PickBlockReason?
       }[]
       lines : com.acme.orders.OrderLine[] as {
          lineId : com.acme.orders.OrderLineId
          productSku : com.acme.catalog.ProductSku
          orderedQuantity : com.acme.shared.Quantity
          mappings : com.acme.db.inventory.InventorySkuMapRow[] as {
             warehouseSku : com.acme.warehouse.WarehouseSku
             supplierId : com.acme.supplier.SupplierId
             supplierPart : com.acme.supplier.SupplierPartNumber
             availability : com.acme.warehouse.StockPosition[] as {
                warehouse : com.acme.warehouse.WarehouseCode
                onHand : com.acme.shared.Quantity
                reserved : com.acme.warehouse.ReservedQuantity
                available : com.acme.warehouse.AvailableQuantity
                inbound : com.acme.procurement.PurchaseOrder[] as {
                   purchaseOrderId : com.acme.procurement.PurchaseOrderId
                   expectedReceipt : com.acme.procurement.ExpectedReceiptDate
                   status : com.acme.procurement.PurchaseOrderStatus
                }[]
             }[]
             supplierLeadTime : com.acme.supplier.LeadTime as {
                leadTimeDays : com.acme.supplier.LeadTimeDays
                asOf : com.acme.supplier.LeadTimeAsOfDate
             }
          }[]
       }[]
    }
- id: C05
  level: 5
  mode: planning
  question: Northbridge needs 200 ACM-7710-X units by Monday, 10 Aug 2026. Can we fulfil that without waiting for the supplier?
  answer: No. Current network free stock is only 40 units (Rotterdam); BHX and Glasgow have no free stock. An approved alternate
    exists, but its inventory would need checking separately.
  sources:
  - crm.searchAccounts
  - billing.getDebtorByCompany
  - db.inventory.inventory_sku_map
  - warehouse.getNetworkAvailability
  - catalog.listProductAlternates
  - logistics.estimateDelivery
  semantic_path:
  - CustomerName
  - CompanyRegistrationNumber
  - ProductSku
  - WarehouseSku
  - AvailableQuantity
  - Alternate ProductSku
  taxiql:
  - |-
    given {
       customerName : com.acme.shared.CustomerName = 'Northbridge Rail Engineering'
       productSku : com.acme.catalog.ProductSku = 'ACM-7710-X'
       requiredQuantity : com.acme.shared.Quantity = 200
       requiredBy : com.acme.shared.BusinessDate = '2026-08-10'
    }
    find { com.acme.catalog.Product } as {
       productSku : com.acme.catalog.ProductSku
       mappings : com.acme.db.inventory.InventorySkuMapRow[] as {
          warehouseSku : com.acme.warehouse.WarehouseSku
          availability : com.acme.warehouse.StockPosition[] as {
             warehouse : com.acme.warehouse.WarehouseCode
             available : com.acme.warehouse.AvailableQuantity
          }[]
       }[]
       approvedAlternates : com.acme.catalog.ProductAlternate[] as {
          alternateSku : com.acme.catalog.ProductSku
          reason : com.acme.catalog.AlternateReason
       }[]
    }
